# GitHub-hosted only: Apple Silicon engine + Windows x64 engine.
# No self-hosted runners, no Defold S3 archive, no signing secrets.
name: Hosted desktop

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

concurrency:
  group: hosted-desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_CHANNEL: 9.0.1xx
  DEFOLD_EDITOR_DISABLE_PERFORMANCE_TESTS: true

jobs:
  engine:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: arm64-macos
            runner: macos-26
            artifact: dmengine-arm64-macos
          - platform: x86_64-win32
            runner: windows-2025-vs2026
            artifact: dmengine-x86_64-win32

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Cache Defold downloads
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.dcache
          key: ${{ runner.os }}-${{ matrix.platform }}-dcache-${{ hashFiles('build_tools/sdk.py') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.platform }}-dcache-
            ${{ runner.os }}-dcache-

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Xcode
        if: runner.os == 'macOS'
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '26.5.0'

      - name: Install Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '25'
          distribution: temurin
          cache: gradle
          cache-dependency-path: |
            com.dynamo.cr/com.dynamo.cr.bob/*.gradle
            com.dynamo.cr/com.dynamo.cr.bob/gradle/wrapper/gradle-wrapper.properties
            com.dynamo.cr/com.dynamo.cr.bob.test/*.gradle
            com.dynamo.cr/com.dynamo.cr.bob.test/gradle/wrapper/gradle-wrapper.properties

      - name: Install CMake
        uses: lukka/get-cmake@f5b8fbb4d77cec1acc5a5f9f0df4beffaf5d98d9 # v4.3.4

      - name: Setup dotnet
        id: setup_dotnet
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: ${{ env.DOTNET_CHANNEL }}

      - name: Pin dotnet SDK
        run: echo "{\"sdk\":{\"version\":\"${{ steps.setup_dotnet.outputs.dotnet-version }}\"}}" > global.json

      - name: Install dependencies
        run: ci/ci.sh install --platform=${{ matrix.platform }}

      - name: Build engine
        run: >
          ci/ci.sh engine
          --platform=${{ matrix.platform }}
          --skip-install-sdk
          --skip-docs
          --skip-tests
          --skip-build-tests

      - name: Upload engine
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: tmp/dynamo_home/bin/${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 14

      - name: Build bob
        run: python -u scripts/build.py build_bob --platform=${{ matrix.platform }} --skip-tests --disable-ccache

      - name: Upload bob
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bob-jar-${{ matrix.platform }}
          path: com.dynamo.cr/com.dynamo.cr.bob/dist/bob.jar
          if-no-files-found: error
          retention-days: 14

      - name: Stop Gradle Daemon
        if: always()
        run: com.dynamo.cr/com.dynamo.cr.bob/gradlew --stop || true
